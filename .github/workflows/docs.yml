name: docs

on:
  pull_request:
    paths:
      - 'docs/**'
      - 'sites/docs.zluggish.com/**'
      - 'sites/scripts/**'
      - 'media/**'
      - 'package.json'
      - 'pnpm-workspace.yaml'
      - 'pnpm-lock.yaml'
      - '.github/workflows/docs.yml'
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'sites/docs.zluggish.com/**'
      - 'sites/scripts/**'
      - 'media/**'
      - 'package.json'
      - 'pnpm-workspace.yaml'
      - 'pnpm-lock.yaml'
      - '.github/workflows/docs.yml'

permissions:
  contents: read

# A new push to a pull request replaces its unfinished build.
# Cloudflare Workers Builds deploys the site; this workflow only checks that it builds.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-26.04
    defaults:
      run:
        working-directory: sites/docs.zluggish.com
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
      - uses: pnpm/action-setup@v6
        with:
          version: '12.18.0'
      - run: pnpm install --frozen-lockfile --filter @zluggish/docs...
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm package
      # Validates the Build Output without credentials, so it also runs for fork pull requests.
      - run: pnpm exec cf deploy --prebuilt --dry-run
